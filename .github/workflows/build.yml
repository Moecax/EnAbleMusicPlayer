name: Build Release APK

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASS: ${{ secrets.KEY_PASS }}
      STORE_PASS: ${{ secrets.STORE_PASS }}

    steps:
      # ---------- Setup ----------

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # ---------- Prepare build ----------

      # Derive the app version from the pushed tag (v1.0.0 -> 1.0.0)
      - name: Compute version
        run: |
          echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      # Codenames are generated and recorded by `fastlane android production`
      # (see fastlane/codenames.txt); read back the one for this tag.
      - name: Compute codename
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          CODENAME=$(grep " v${VERSION_NAME}\$" fastlane/codenames.txt 2>/dev/null | tail -1 | cut -d' ' -f1)
          echo "CODENAME=${CODENAME:-Dev Build}" >> "$GITHUB_ENV"

      # Inject API keys into source (replaced at compile time)
      - name: Inject API keys
        env:
          RAPID_KEY: ${{ secrets.RAPID_KEY }}
        run: |
          CONSTANTS="app/src/main/kotlin/io/github/moecax/enable/utils/Constants.kt"
          sed -i "s/INSERT_RAPID_KEY/${RAPID_KEY}/" "$CONSTANTS"

      # Decode the release keystore from a base64 secret
      - name: Fetch signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "${KEYSTORE_BASE64}" | base64 -d > app/release.keystore

      # ---------- Build ----------

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --configuration-cache --parallel

      # ---------- Upload artifacts ----------

      # Rename each per-ABI APK to include the version
      - name: Rename APKs
        run: |
          for APK in app/build/outputs/apk/release/*.apk; do
            ABI=$(basename "$APK" .apk | sed 's/app-//' | sed 's/-release//' | sed 's/-unsigned//')
            mv "$APK" "app/build/outputs/apk/release/Enable-${ABI}-${VERSION_NAME}.apk"
          done

      # Save APKs as GitHub Actions artifacts for easy download
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Enable-${{ env.VERSION_NAME }}
          path: app/build/outputs/apk/release/*.apk

      # Create a GitHub Release with the APKs
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Pull this version's section out of CHANGELOG.md (as written by
          # `fastlane android production`): everything between its "## vX.Y.Z"
          # heading and the next "## " heading (or end of file).
          SECTION=$(awk -v ver="## v${VERSION_NAME}" '
            $0 ~ "^" ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)
          # Trim leading and trailing blank lines, keep blank lines in between.
          NOTES=$(printf '%s\n' "$SECTION" | sed -e '/./,$!d' | tac | sed -e '/./,$!d' | tac)

          if [ -z "$NOTES" ]; then
            COMMIT_MSG=$(git log -1 --pretty=%s)
            NOTES=$(printf 'Automated release from commit [`%s`](https://github.com/${{ github.repository }}/commit/%s)\n\n**%s**' \
              "${GITHUB_SHA::8}" "$GITHUB_SHA" "$COMMIT_MSG")
          fi

          gh release create "${GITHUB_REF_NAME}" \
            --title "En-able ${VERSION_NAME} \"${CODENAME}\"" \
            --notes "$NOTES" \
            --latest \
            app/build/outputs/apk/release/*.apk
